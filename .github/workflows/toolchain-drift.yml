# ============================================================================
#  工具鏈漂移探測 — 每日以最新工具鏈跑「型別 + 嚴格提示」兩道閘門
#
#  目的：本專案把六類選擇性警告常開，而 MoonBit 演進很快
#        （例：0.10.4 新增 extend 並棄用隱式方法推廣；0.10.14 起 E0079 預設開啟）。
#        本 workflow 讓「新版工具鏈帶來新警告」在隔日就被看見，而不是等到發版。
#
#  紅燈不代表現在壞了，而是「最新工具鏈下需要一次警告複核」。
# ============================================================================
name: Toolchain drift

on:
  schedule:
    - cron: "17 3 * * *" # 每日 03:17 UTC
  workflow_dispatch:

jobs:
  drift:
    name: 最新工具鏈 × 嚴格提示
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: 安裝最新 MoonBit 工具鏈
        uses: hustcer/setup-moonbit@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 版本（本 workflow 之重點輸出）
        run: moon version --all

      - name: 型別檢查（預設提示）
        run: moon check --target all --deny-warn

      - name: 嚴格提示（全部）
        run: moon check --target all --warn-list "+all" --deny-warn
