# ============================================================================
#  CI — 九道閘門
#  原則：任何一道紅燈即不通過。這些閘門與 AGENTS.md §6 完全一致。
#
#  工具鏈：預設安裝最新版；若要釘住版本，在 setup 步驟加 `version:` 引數
#          （先以 `moon version --all` 確認可用字串）。工具鏈漂移由
#          .github/workflows/toolchain-drift.yml 每日獨立探測。
# ============================================================================
name: CI

on:
  push:
    branches: ["v0.1.2", "main"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    name: 閘門（型別 · 目錄 · 生成物 · 報表 · 格式 · 介面）
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4

      - name: 安裝 MoonBit 工具鏈
        uses: hustcer/setup-moonbit@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 版本（回溯用）
        run: moon version --all

      # ---- 閘門 1：型別檢查（預設提示）----
      - name: 1 型別檢查
        run: moon check --target all --deny-warn

      # ---- 閘門 2：嚴格提示（全部提示開啟）----
      - name: 2 嚴格提示（+all）
        run: moon check --target all --warn-list "+all" --deny-warn

      # ---- 閘門 3：目錄迴歸 + 抽樣政策對帳（且整個建置不得有警告）----
      - name: 3 目錄迴歸與政策對帳
        run: |
          set -o pipefail
          moon test 2>&1 | tee /tmp/test.log
          grep -q "失敗 0" /tmp/test.log
          grep -q "違反 0 條" /tmp/test.log
          if grep -q "Warning" /tmp/test.log; then
            echo "::error::測試建置出現警告"; exit 1
          fi

      # ---- 閘門 4：生成器逐位元組可重現（N-45）----
      - name: 4 生成器可重現
        run: |
          moon run cmd/genoblig > /tmp/oblig_auto.mbt
          diff -u oblig_auto.mbt /tmp/oblig_auto.mbt

      # ---- 閘門 5：全庫自證判準 ----
      - name: 5 全庫自證（242 條）
        run: |
          moon run cmd/main > /tmp/main.log
          grep -E "全部義務通過：[0-9]+/[0-9]+，無未決條目" /tmp/main.log

      # ---- 閘門 6：報表與入庫文件一致 ----
      - name: 6 報表一致（docs/評審報告.md）
        run: |
          moon run cmd/report > /tmp/report.md
          diff -u docs/評審報告.md /tmp/report.md

      # ---- 閘門 7：格式（唯一例外：生成物 oblig_auto.mbt）----
      - name: 7 格式
        run: |
          moon check --fmt 2>&1 | tee /tmp/fmt.log
          if grep "File not formatted" /tmp/fmt.log | grep -v "oblig_auto.mbt" | grep -q .; then
            echo "::error::有檔案未格式化（oblig_auto.mbt 除外）"; exit 1
          fi

      # ---- 閘門 8：公共介面漂移 ----
      - name: 8 公共介面（pkg.generated.mbti）
        run: |
          moon info
          git diff --exit-code -- '*.mbti' || {
            echo "::error::公共介面與入庫快照不一致；請執行 moon info 並提交"; exit 1; }

      # ---- 閘門 9：子集模式自檢（--only 只影響執行範圍，不改變判準）----
      - name: 9 子集模式（--only）
        run: |
          moon run cmd/main -- --only K | tee /tmp/only_k.log | grep -qE "全部義務通過：[0-9]+/[0-9]+"
          grep -q "模式：僅執行前綴「K」" /tmp/only_k.log
          HILBERT_ONLY=N-8 moon run cmd/main | tee /tmp/only_n8.log | grep -qE "全部義務通過：[0-9]+/[0-9]+"
          grep -q "模式：僅執行前綴「N-8」" /tmp/only_n8.log
